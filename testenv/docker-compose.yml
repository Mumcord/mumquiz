# Local Mumble test server for the live tests and the smoke run. Start with ./up.sh.
# Never a public server: scripts/ci/check-loopback.sh guards the hosts the tests use, and the ports
# below publish on loopback only.

services:
  server:
    image: mumblevoip/mumble-server:v1.5.735
    restart: "no"
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      MUMBLE_SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:?copy .env.example to .env}
      MUMBLE_ACCEPT_UNKNOWN_SETTINGS: "true"
      MUMBLE_CONFIG_REGISTERNAME: Mumquiz Test Server
      MUMBLE_CONFIG_BANDWIDTH: "72000"
      # The tests reconnect often; a public runner would ban them.
      MUMBLE_CONFIG_AUTOBANATTEMPTS: "0"
    ports:
      - "127.0.0.1:${MUMQUIZ_TEST_PORT:-64738}:64738/tcp"
      - "127.0.0.1:${MUMQUIZ_TEST_PORT:-64738}:64738/udp"
    volumes:
      - "./${DATA_ROOT:-data}/server:/data"
