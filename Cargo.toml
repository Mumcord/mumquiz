[package]
name = "mumquiz"
description = "Quiz bot for standard Mumble servers: asks questions, awards points, keeps high scores"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/Mumcord/mumquiz"
publish = false

[dependencies]
# Published by the Mumcord client project; the bot is a normal Mumble client with a certificate,
# so it works against an unmodified murmur without any server plugin.
mumcord-protocol = "0.4"
tokio = { version = "1.54", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "1.1"
# High scores of the ported bot keep their SQLite storage.
rusqlite = { version = "0.41", features = ["bundled"] }
# The bot's own identity: one self-signed certificate per name, kept across reconnects.
rcgen = "0.14"
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "mumquiz"
path = "src/lib.rs"

[[bin]]
name = "mumquiz"
path = "src/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

# Errors, not warnings: a run without `-D warnings` must still catch these.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
