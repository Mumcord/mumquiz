<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">mumquiz</title>
  <desc id="desc">A chat bubble with a question mark and a star for the points</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1478"/>
      <stop offset="1" stop-color="#140a3a"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="96" y1="120" x2="420" y2="420">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#8b6cff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
