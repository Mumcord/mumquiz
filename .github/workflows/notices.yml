name: Third-party notices

# Regenerates THIRD_PARTY_NOTICES.md (scripts/generate-notices.sh) after dependency changes on the
# default branch. When the list changed, it commits the new file on the fixed branch
# chore/regenerate-notices and opens or updates the pull request "chore: regenerate third-party
# notices"; the default branch is protected, so nothing is pushed there. A pull request opened with
# the workflow token starts no workflows by itself, so this run then starts CI on the branch; its
# checks land on the head commit, which is what a required check looks at. Opening the pull request
# needs the repository setting "Allow GitHub Actions to create and approve pull requests"; without
# it the branch is still pushed and the run prints a link to open the pull request by hand.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - about.toml
      - scripts/notices/about.hbs
      - scripts/generate-notices.sh
      - scripts/tools.env
      - .github/workflows/notices.yml
  workflow_dispatch:

# A newer push to main makes a running regeneration obsolete.
concurrency:
  group: notices
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Starts CI on the branch.
  actions: write

env:
  BRANCH: chore/regenerate-notices
  TITLE: "chore: regenerate third-party notices"

jobs:
  notices:
    name: Regenerate notices
    # The pull request always targets the default branch, so a manual run on another branch does
    # nothing.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned tool version
        id: tools
        run: grep '^[A-Z_]*=' scripts/tools.env >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable

      # The runner image does not carry cargo-about, so it is installed at the pinned version: a
      # different version can produce a different list.
      - name: Install cargo-about
        run: cargo install cargo-about --version "${{ steps.tools.outputs.CARGO_ABOUT_VERSION }}" --locked --features cli

      - name: Generate
        run: scripts/generate-notices.sh

      - name: Commit and open the pull request when the list changed
        run: |
          if git diff --quiet -- THIRD_PARTY_NOTICES.md; then
            echo "THIRD_PARTY_NOTICES.md is current, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add THIRD_PARTY_NOTICES.md
          git commit -m "$TITLE"
          git push -f origin "$BRANCH"

          open=$(gh pr list --state open --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh pr comment "$open" --body "Regenerated in run ${GITHUB_RUN_NUMBER}, the branch got a new commit."
          else
            gh pr create --title "$TITLE" --body "Generated by scripts/generate-notices.sh in run ${GITHUB_RUN_NUMBER}. Do not edit the file by hand."
          fi
          gh workflow run ci.yml --ref "$BRANCH"
        env:
          GH_TOKEN: ${{ github.token }}
